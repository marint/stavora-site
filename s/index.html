<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Stavora</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root { --bg: #0a1020; --text: #eef2fb; --muted: #a9b4cc; --brand: #2f7bf6; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6fb; --text: #10182b; --muted: #55617a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 420px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.button { display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--brand); color: #fff;
    font-weight: 600; text-decoration: none; }
  small { display: block; margin-top: 24px; color: var(--muted); }
  small a { color: inherit; }
</style>
</head>
<body>
<!-- A conductor's link https://stavora.app/s#… that opened in a browser: the update is in
     the part after #, which never reached this server. The button hands it to the app. -->
<main>
  <img src="../assets/apple-touch-icon.png" alt="">
  <h1 id="title">An update for Stavora</h1>
  <p id="lead">Markings for a setlist from your choir or band.</p>
  <a class="button" id="open" href="stavora://s">Open in Stavora</a>
  <small id="none">No Stavora yet? <a href="../">stavora.app</a></small>
</main>
<script>
  document.getElementById('open').href = 'stavora://s' + location.hash;
  var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0, 2);
  if (lang === 'fi') {
    document.documentElement.lang = 'fi';
    document.getElementById('title').textContent = 'Päivitys Stavoraan';
    document.getElementById('lead').textContent = 'Kuoron tai bändin settilistan merkinnät.';
    document.getElementById('open').textContent = 'Avaa Stavorassa';
    document.getElementById('none').innerHTML = 'Ei vielä Stavoraa? <a href="../fi/">stavora.app</a>';
  }
</script>
</body>
</html>
